name: Build and Release MrFeastProjectBank

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Next Semantic Version
        id: versioning
        run: |
          # Fetch latest release tag from GitHub repository
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.5")
          CLEAN_VERSION=${LATEST_TAG#v}

          # Split into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-5}

          # Auto-increment patch version (1.0.5 -> 1.0.6 -> 1.0.7...)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          NEXT_TAG="v${NEXT_VERSION}"
          NEXT_CODE=$(( (MAJOR * 10000) + (MINOR * 100) + NEXT_PATCH ))

          echo "CURRENT_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "NEXT_TAG=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "NEXT_CODE=$NEXT_CODE" >> $GITHUB_OUTPUT
          echo "Calculated Next Release: $NEXT_VERSION ($NEXT_TAG) with versionCode $NEXT_CODE"

      - name: Update Version in build.gradle.kts
        run: |
          sed -i 's/versionCode = [0-9]*/versionCode = ${{ steps.versioning.outputs.NEXT_CODE }}/' app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "${{ steps.versioning.outputs.NEXT_VERSION }}"/' app/build.gradle.kts

      - name: Restore persistent debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from base64"
          fi

      - name: Build Signed APK
        run: ./gradlew assembleDebug

      - name: Rename and Prepare APK Asset
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/MrFeastProjectBank-${{ steps.versioning.outputs.NEXT_VERSION }}.apk || \
          cp app/build/outputs/apk/debug/*.apk release-artifacts/MrFeastProjectBank-${{ steps.versioning.outputs.NEXT_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.NEXT_TAG }}
          name: "MrFeastProject Bank ${{ steps.versioning.outputs.NEXT_VERSION }}"
          body: |
            ## MrFeastProject Bank ${{ steps.versioning.outputs.NEXT_VERSION }}
            
            - Регулярное обновление безопасности и производительности банка
            - Мгновенные переводы в реальном времени
            - Бесконтактный POS терминал с аппаратной поддержкой NFC
            - Автоматическое обновление приложения
          files: release-artifacts/MrFeastProjectBank-${{ steps.versioning.outputs.NEXT_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
