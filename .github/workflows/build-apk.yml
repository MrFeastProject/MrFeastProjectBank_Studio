name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create release version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            -PciVersionCode=${{ steps.version.outputs.version_code }} \
            -PciVersionName=${{ steps.version.outputs.version_name }} \
            --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/*.apk \
            "MrFeastProjectBank-${{ steps.version.outputs.version_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"

          gh release create "$TAG" \
            "MrFeastProjectBank-${{ steps.version.outputs.version_name }}.apk" \
            --title "MrFeastProject Bank ${{ steps.version.outputs.version_name }}" \
            --generate-notes \
            --latest
