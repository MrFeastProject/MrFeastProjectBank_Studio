name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create release version
        id: version
        shell: bash
        run: |
          # Ensure version is at least 1.0.8
          PATCH=$((GITHUB_RUN_NUMBER < 8 ? 8 : GITHUB_RUN_NUMBER))
          VERSION_CODE=$((10000 + PATCH))
          VERSION_NAME="1.0.${PATCH}"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      - name: Restore persistent debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored persistent debug.keystore from base64"
          elif [ -f debug.keystore ]; then
            echo "debug.keystore already present"
          else
            echo "Error: debug.keystore.base64 is required to ensure matching APK signing certificates"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            -PciVersionCode=${{ steps.version.outputs.version_code }} \
            -PciVersionName=${{ steps.version.outputs.version_name }} \
            --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/*.apk \
            "MrFeastProjectBank-${{ steps.version.outputs.version_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"

          gh release create "$TAG" \
            "MrFeastProjectBank-${{ steps.version.outputs.version_name }}.apk" \
            --title "MrFeastProject Bank ${{ steps.version.outputs.version_name }}" \
            --generate-notes \
            --latest
